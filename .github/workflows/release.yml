name: Release

# Tag a version and this attaches a ready-to-load zip to the release, so
# installing needs no Node, no npm, and no clone.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The build has to pass its own tests before anyone downloads it.
      - run: npm test

      - name: Check the tag matches the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      # The same script used locally, so CI and a hand-built zip cannot drift
      # apart. It writes release/wag-inbox-vX.Y.Z.zip with the manifest at the
      # archive root.
      - name: Build the installable zip
        run: npm run package

      # gh and GITHUB_TOKEN are already on the runner, so this needs no
      # third-party action and no secret of its own.
      # A release may already exist, if one was drafted by hand before the tag
      # was pushed. Attaching to it beats failing outright.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          zip="release/wag-inbox-${tag}.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip"               --title "WAG Inbox $tag"               --notes-file RELEASE_NOTES.md
          fi
